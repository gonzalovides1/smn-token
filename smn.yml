name: SMN token

on:
  schedule:
    - cron: '*/30 * * * *'   # cada 30 minutos (el token del SMN dura ~60 min)
  workflow_dispatch: {}       # botón para correrlo a mano cuando quieras

permissions:
  contents: write             # para poder guardar token.json en el repo

concurrency:
  group: smn-token
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: npx playwright install --with-deps chromium

      - name: Obtener token del SMN
        run: node scrape.js

      - name: Guardar token.json en el repo
        run: |
          git config user.name "smn-bot"
          git config user.email "smn-bot@users.noreply.github.com"
          git add token.json
          git commit -m "actualiza token SMN" || echo "sin cambios"
          git push
